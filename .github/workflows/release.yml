# 手动为已有版本 tag 构建 macOS Apple Silicon 草稿，验证后再发布。
# 本地发布见 scripts/package-release.sh；CI 需单独配置更新签名 Secrets。
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的版本 tag，例如 v0.1.0"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - name: Check version and signing key
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Configure TAURI_SIGNING_PRIVATE_KEY before running the release workflow.' >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build Hook
        run: |
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\n' > src-tauri/binaries/agentpulse-hook-aarch64-apple-darwin
          chmod +x src-tauri/binaries/agentpulse-hook-aarch64-apple-darwin
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin agentpulse-hook --target aarch64-apple-darwin
          cp src-tauri/target/aarch64-apple-darwin/release/agentpulse-hook src-tauri/binaries/agentpulse-hook-aarch64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: AgentPulse ${{ inputs.tag }}
          releaseBody: "macOS 13+ / Apple Silicon。使用 ad-hoc 签名，未做 Apple 公证；安装与接入见 https://q1ngsong.github.io/AgentPulse/guide/ 。"
          releaseDraft: true
          args: --target aarch64-apple-darwin
