# 打 tag（v0.1.0 这种）自动构建三平台安装包，发布到 GitHub Releases，并生成更新用的 latest.json。
# 需要的 Secrets：TAURI_SIGNING_PRIVATE_KEY（~/.tauri/agentpulse.key 的内容）、TAURI_SIGNING_PRIVATE_KEY_PASSWORD（可为空）。
# macOS 不做 Apple 签名与公证（没有开发者账号）：用户首次打开需右键「打开」或 xattr -cr。
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: 编译 Hook 并放入 externalBin
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          printf '#!/bin/sh\n' > "src-tauri/binaries/agentpulse-hook-${{ matrix.target }}$ext"
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin agentpulse-hook --target ${{ matrix.target }}
          cp "src-tauri/target/${{ matrix.target }}/release/agentpulse-hook$ext" "src-tauri/binaries/agentpulse-hook-${{ matrix.target }}$ext"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AgentPulse ${{ github.ref_name }}"
          releaseBody: "macOS 未签名：首次打开请右键「打开」，或运行 xattr -cr /Applications/AgentPulse.app"
          releaseDraft: true
          args: --target ${{ matrix.target }}
