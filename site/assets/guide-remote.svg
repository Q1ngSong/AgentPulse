<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">延迟远程推送</title><desc id="desc">本机提醒没人处理时，AgentPulse 可以延迟推送到飞书或微信。</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e2ecff"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d335f" flood-opacity=".13"/></filter></defs>
<rect width="920" height="420" rx="28" fill="url(#bg)"/>
<g filter="url(#shadow)"><rect x="98" y="96" width="220" height="210" rx="28" fill="#fff"/><text x="142" y="154" fill="#17223a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="700">本机提醒</text><rect x="136" y="192" width="144" height="42" rx="21" fill="#edf3ff"/><text x="162" y="219" fill="#2563df" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="700">立即显示</text></g>
<g><path d="M340 202h170" stroke="#2563df" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 20"/><circle cx="426" cy="202" r="42" fill="#202d46"/><text x="390" y="210" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700">5 分钟</text></g>
<g filter="url(#shadow)"><rect x="560" y="70" width="230" height="286" rx="34" fill="#202d46"/><rect x="592" y="112" width="166" height="190" rx="24" fill="#fff"/><rect x="618" y="144" width="110" height="26" rx="13" fill="#edf3ff"/><rect x="618" y="188" width="110" height="26" rx="13" fill="#edf3ff"/><rect x="618" y="232" width="78" height="26" rx="13" fill="#dce8ff"/><text x="619" y="331" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700">飞书 / 微信</text></g>
</svg>
